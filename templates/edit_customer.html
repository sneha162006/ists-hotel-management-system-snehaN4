{% extends "base.html" %}
{% block title %}Edit Customer{% endblock %}
{% block nav_customers %}active{% endblock %}

{% block content %}
<div class="page-title">
  <h1>Edit Customer</h1>
  <a class="btn btn-gray" href="{{ url_for('customers') }}">← Back</a>
</div>

<div class="card">
  <form method="POST" action="{{ url_for('edit_customer', id=customer.id) }}">
    <div class="form-grid">
    <div>
      <label for="full_name">Full Name</label>
      <input type="text" id="full_name" name="full_name" value="{{ customer.full_name }}"  required>
    </div>
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ customer.email }}"  required>
    </div>
    <div>
      <label for="phone">Phone</label>
      <input type="text" id="phone" name="phone" value="{{ customer.phone }}"  required>
    </div>
    <div>
      <label for="gender">Gender</label>
      <select id="gender" name="gender" required>
        <option value="Male" {% if customer.gender == 'Male' %}selected{% endif %}>Male</option>
        <option value="Female" {% if customer.gender == 'Female' %}selected{% endif %}>Female</option>
        <option value="Other" {% if customer.gender == 'Other' %}selected{% endif %}>Other</option>
      </select>
    </div>
    <div>
      <label for="date_of_birth">Date of Birth</label>
      <input type="date" id="date_of_birth" name="date_of_birth" value="{{ customer.date_of_birth }}"  required>
    </div>
    <div>
      <label for="id_proof_type">ID Proof Type</label>
      <select id="id_proof_type" name="id_proof_type" required>
        <option value="Passport" {% if customer.id_proof_type == 'Passport' %}selected{% endif %}>Passport</option>
        <option value="Driving License" {% if customer.id_proof_type == 'Driving License' %}selected{% endif %}>Driving License</option>
        <option value="National ID" {% if customer.id_proof_type == 'National ID' %}selected{% endif %}>National ID</option>
        <option value="Voter ID" {% if customer.id_proof_type == 'Voter ID' %}selected{% endif %}>Voter ID</option>
        <option value="Aadhaar Card" {% if customer.id_proof_type == 'Aadhaar Card' %}selected{% endif %}>Aadhaar Card</option>
      </select>
    </div>
    <div>
      <label for="id_proof_number">ID Proof Number</label>
      <input type="text" id="id_proof_number" name="id_proof_number" value="{{ customer.id_proof_number }}"  required>
    </div>
    {% include "_room_picker.html" %}
    <div>
      <label for="check_in_date">Check-in Date</label>
      <input type="date" id="check_in_date" name="check_in_date" value="{{ customer.check_in_date }}"  required>
    </div>
    <div>
      <label for="check_out_date">Check-out Date</label>
      <input type="date" id="check_out_date" name="check_out_date" value="{{ customer.check_out_date }}"  required>
    </div>
    <div>
      <label for="number_of_guests">Number of Guests</label>
      <input type="number" id="number_of_guests" name="number_of_guests" value="{{ customer.number_of_guests }}" min="1" required>
    </div>
    <div>
      <label for="booking_status">Booking Status</label>
      <select id="booking_status" name="booking_status" required>
        <option value="Pending" {% if customer.booking_status == 'Pending' %}selected{% endif %}>Pending</option>
        <option value="Confirmed" {% if customer.booking_status == 'Confirmed' %}selected{% endif %}>Confirmed</option>
        <option value="Checked-in" {% if customer.booking_status == 'Checked-in' %}selected{% endif %}>Checked-in</option>
        <option value="Checked-out" {% if customer.booking_status == 'Checked-out' %}selected{% endif %}>Checked-out</option>
        <option value="Cancelled" {% if customer.booking_status == 'Cancelled' %}selected{% endif %}>Cancelled</option>
      </select>
    </div>
    <div>
      <label for="payment_status">Payment Status</label>
      <select id="payment_status" name="payment_status" required>
        <option value="Pending" {% if customer.payment_status == 'Pending' %}selected{% endif %}>Pending</option>
        <option value="Partial" {% if customer.payment_status == 'Partial' %}selected{% endif %}>Partial</option>
        <option value="Paid" {% if customer.payment_status == 'Paid' %}selected{% endif %}>Paid</option>
      </select>
    </div>
    <div class="full">
      <label for="address">Address</label>
      <textarea id="address" name="address" rows="2" required>{{ customer.address }}</textarea>
    </div>
    </div>

    <div class="form-buttons">
      <button type="submit" class="btn">Update Customer</button>
      <a class="btn btn-gray" href="{{ url_for('customers') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
